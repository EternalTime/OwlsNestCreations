<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Favorite Spacetimes - screenshot placeholder source</title>
<!--
  Source for assets/img/mfs-placeholder-1.png through -4.png: the
  stand-ins the app's page and the press kit show until real captures exist.
  They are 720x1200, the size _includes/mfs-shot.html declares, which is
  the size the VoidFlux captures are cropped to.

  There are four because the press kit tiles its screenshots two to a row, as
  the VoidFlux kit does, and an odd count leaves an orphan on the last row.

  Every board is a self-contained still in the studio's own tokens, so
  Chrome's own --screenshot renders it straight off disk, one board per run:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    for n in 1 2 3 4; do
      "$CHROME" --headless --disable-gpu --hide-scrollbars \
        --screenshot="assets/img/mfs-placeholder-$n.png" --window-size=720,1200 \
        "file://$PWD/assets/img/mfs-placeholder.html#$n"
    done

  Delete a board here when its real capture lands, rather than leaving a
  placeholder nobody is rendering any more.
-->
<style>
  :root {
    /* _sass/tokens.scss - the studio's palette, deliberately not the app's:
       a placeholder should not look like a frame of My Favorite Spacetimes. */
    --paper: #fdf6ec;
    --ink: #1c1a24;
    --accent: #1f7a4d;
    --amber: #f9b450;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: var(--paper); overflow: hidden; }

  body {
    color: var(--ink);
    font-family: 'Avenir Next', 'Nunito', 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
  }

  .board { display: none; }
  body[data-board="1"] .board-1,
  body[data-board="2"] .board-2,
  body[data-board="3"] .board-3,
  body[data-board="4"] .board-4 { display: flex; }

  .board {
    width: 720px;
    height: 1200px;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 5rem 3.5rem;
    text-align: center;
    /* Hatching, so no crop of this can pass as a capture of the app. */
    background:
      repeating-linear-gradient(
        -45deg,
        rgba(31, 122, 77, 0.07) 0 14px,
        rgba(253, 246, 236, 0) 14px 40px
      ),
      var(--paper);
    border: 6px dashed var(--accent);
    border-radius: 44px;
  }

  .head,
  .main,
  .foot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6rem;
  }

  .owl-glyph { width: 76px; height: 76px; }

  .studio {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .stamp {
    font-size: 3.6rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.05;
    text-transform: uppercase;
    color: var(--accent);
  }

  .rule {
    width: 180px;
    height: 6px;
    border-radius: 999px;
    background: var(--amber);
  }

  .game {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .note {
    max-width: 26rem;
    font-size: 1.2rem;
    line-height: 1.6;
    opacity: 0.72;
  }

  .slot,
  .spec {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    opacity: 0.55;
  }
</style>
</head>
<body>

<template id="board">
  <div class="head">
    <svg class="owl-glyph" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M6 7 L11 2 L13 8 Z" fill="var(--ink)"/>
      <path d="M28 7 L23 2 L21 8 Z" fill="var(--ink)"/>
      <circle cx="17" cy="18" r="15" fill="var(--ink)"/>
      <circle cx="11.5" cy="16" r="6" fill="var(--paper)"/>
      <circle cx="22.5" cy="16" r="6" fill="var(--paper)"/>
      <circle cx="11.5" cy="16" r="2.6" fill="var(--accent)"/>
      <circle cx="22.5" cy="16" r="2.6" fill="var(--accent)"/>
      <path d="M17 20 L14.8 23.5 L19.2 23.5 Z" fill="var(--amber)"/>
    </svg>
    <div class="studio">Owl's Nest Creations</div>
  </div>
  <div class="main">
    <div class="stamp">Placeholder</div>
    <div class="rule"></div>
    <div class="game">My Favorite Spacetimes</div>
    <p class="note">No screenshot of this app has been taken yet. This card stands in the slot until one has.</p>
  </div>
  <div class="foot">
    <div class="slot"></div>
    <div class="spec">720 &times; 1200</div>
  </div>
</template>

<section class="board board-1"></section>
<section class="board board-2"></section>
<section class="board board-3"></section>
<section class="board board-4"></section>

<script>
  const template = document.getElementById('board');
  document.querySelectorAll('.board').forEach((board, i) => {
    board.append(template.content.cloneNode(true));
    board.querySelector('.slot').textContent = `Slot ${i + 1}`;
  });
  // One board per render, chosen by fragment, exactly as the social boards do it.
  const pick = () => { document.body.dataset.board = location.hash.slice(1) || '1'; };
  addEventListener('hashchange', pick);
  pick();
</script>

</body>
</html>
