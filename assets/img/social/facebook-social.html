<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Owl's Nest Creations - Facebook artwork source</title>
<!--
  Source for assets/img/social/facebook-cover.png, facebook-profile.png and
  voidflux-promo.png. Rendered headless, one board per run.

  The two cream boards are self-contained and render straight off disk:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/img/social/facebook-cover.png --window-size=1640,664 \
      "file://$PWD/assets/img/social/facebook-social.html#cover"
    "$CHROME" --headless --disable-gpu --hide-scrollbars \
      --screenshot=assets/img/social/facebook-profile.png --window-size=1080,1080 \
      "file://$PWD/assets/img/social/facebook-social.html#profile"

  The VoidFlux board is the site's own live banner rather than a still, so it
  cannot be shot with --screenshot. It has its own headless runner, which serves
  the repo, waits for the scene to mount and stops everything again:

    node assets/img/social/render-voidflux-promo.mjs

  Read that file before changing anything here: it documents why the flag alone
  fails, and how it fails - silently, with the grid drawn and the loops and gems
  missing. Always look at the PNG after a render.
-->
<style>
  /* The face the site itself gives the VoidFlux title, loaded off disk so a
     headless render needs no network. */
  @font-face {
    font-family: 'Paytone One';
    src: url('../../fonts/PaytoneOne-Regular.ttf') format('truetype');
  }

  :root {
    --paper: #fdf6ec;
    --ink: #1c1a24;
    --accent: #1f7a4d;
    --amber: #f9b450;

    /* The VoidFlux field's own palette, from _sass/voidflux.scss. */
    --vf-void: #04040e;
    --vf-teal-bright: #49ffe9;

    /* Facebook crops the cover hard on phones; everything lives in here. */
    --safe-width: 1092px;
    /* The hero column itself, centred inside that safe area. */
    --column-width: 1000px;
    /* Facebook lays the round profile photo over the foot of the cover - low
       and centred on a phone, bottom-left on a desktop - so the cover keeps
       this much of its height empty and the content balances in what is left. */
    --cover-reserved-foot: 240px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--paper);
    overflow: hidden;
  }

  body {
    color: var(--ink);
    font-family: 'Avenir Next', 'Nunito', 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
  }

  .board { display: none; overflow: hidden; background: var(--paper); }
  body[data-board="cover"] .board-cover { display: block; }
  body[data-board="profile"] .board-profile { display: block; }
  body[data-board="voidflux"] .board-voidflux { display: block; }

  /* ---- Cover: 1640x664 ---- */

  .board-cover {
    width: 1640px;
    height: 664px;
  }

  .board-cover .safe {
    width: var(--safe-width);
    height: 100%;
    padding-bottom: var(--cover-reserved-foot);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .board-cover .column {
    width: var(--column-width);
    text-align: center;
  }

  .wordmark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-weight: 800;
    font-size: 40px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--ink);
  }

  /* Sized in em so a board sets the whole mark, owl included, from one
     font-size. At the cover's 40px that is the 56px owl it has always had. */
  .wordmark svg { width: 1.4em; height: 1.4em; }

  .wm-accent { color: var(--accent); }

  .board-cover h1 {
    margin-top: 44px;
    font-size: 118px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.03em;
  }

  .hero-accent { color: var(--accent); }

  /* ---- Profile: 1080x1080 ---- */

  .board-profile {
    width: 1080px;
    height: 1080px;
  }

  /* The viewBox is chosen so the owl's minimum enclosing circle - centred on
     (17, 16.919355) in glyph units with radius 16.080645, the circle through
     both ear-tuft apexes and around the head - renders 820px across, inside
     Facebook's 860px inscribed-circle crop. */
  .board-profile svg {
    display: block;
    width: 1080px;
    height: 1080px;
  }

  /* ---- VoidFlux promo post: 1200x1200 ----

     The square is the site's home-page banner and nothing else: the same
     `.vf-field` markup, the same two canvases, booted by the same
     voidflux-banner.js. Everything below is copied from _sass/voidflux.scss so
     the render is the banner rather than a lookalike; the one thing that is not
     the site's is the layout, because the banner is a wide block with its copy
     ranged left and this is a square with its copy centred.

     The banner's `.vf-field::after` scrim is kept but re-aimed. On the site it
     is a left-to-right ramp clearing a column for the headline, blurb, button
     and badge; here the copy is a centred block, so the same voidBlack ramp is
     centred on it and falls to nothing well before the edges. The loops have to
     stay readable through it, so it tops out at the site's own 0.8. */

  .board-voidflux {
    width: 1200px;
    height: 1200px;
    position: relative;
    isolation: isolate;
    background: var(--vf-void);
    color: #fff;
  }

  .vf-grid,
  .vf-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  .vf-grid { z-index: -2; }
  /* The site fades the scene in over 0.6s; a still has nothing to fade from. */
  .vf-scene { z-index: -1; opacity: 0; }
  .board-voidflux[data-vf-ready] .vf-scene { opacity: 1; }

  .board-voidflux::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(
      ellipse 54% 21% at 50% 46%,
      rgba(4, 4, 14, 0.8) 0%,
      rgba(4, 4, 14, 0.66) 44%,
      rgba(4, 4, 14, 0) 100%
    );
  }

  /* The copy sits on the horizon band, where the grid's own fade mask thins the
     lines to almost nothing, so it lands on the calmest part of the field. That
     band is a fixed pixel offset above centre (VANISHING_Y in
     voidflux-banner.js) rather than a fraction of the height, which is why the
     block is positioned instead of centred. */
  .board-voidflux .game-blurb {
    position: absolute;
    z-index: 1;
    left: 0;
    right: 0;
    top: 408px;
    padding: 0 80px;
    text-align: center;
    text-shadow: 0 2px 18px rgba(4, 4, 14, 0.9);
  }

  .board-voidflux .game-title {
    font-family: 'Paytone One', sans-serif;
    font-size: 210px;
    font-weight: 400;
    line-height: 1;
    color: #fff;
    text-shadow:
      0 0 22px rgba(55, 223, 255, 0.55),
      0 0 60px rgba(255, 73, 201, 0.35);
  }

  .board-voidflux .game-tag {
    margin-top: 42px;
    font-size: 45px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--vf-teal-bright);
  }
</style>
</head>
<body>

<div class="board board-cover">
  <div class="safe">
   <div class="column">
    <div class="wordmark">
      <svg width="56" height="56" viewBox="0 0 34 34" aria-hidden="true">
        <path d="M6 7 L11 2 L13 8 Z" fill="var(--ink)"/>
        <path d="M28 7 L23 2 L21 8 Z" fill="var(--ink)"/>
        <circle cx="17" cy="18" r="15" fill="var(--ink)"/>
        <circle cx="11.5" cy="16" r="6" fill="var(--paper)"/>
        <circle cx="22.5" cy="16" r="6" fill="var(--paper)"/>
        <circle cx="11.5" cy="16" r="2.6" fill="var(--accent)"/>
        <circle cx="22.5" cy="16" r="2.6" fill="var(--accent)"/>
        <path d="M17 20 L14.8 23.5 L19.2 23.5 Z" fill="var(--amber)"/>
      </svg>
      <span class="wm-text">Owl's <span class="wm-accent">Nest</span></span>
    </div>
    <h1>We make games<br>out of <span class="hero-accent">physics</span>.</h1>
   </div>
  </div>
</div>

<div class="board board-profile">
  <svg viewBox="-4.18145 -4.26210 42.36290 42.36290" aria-hidden="true">
    <path d="M6 7 L11 2 L13 8 Z" fill="var(--ink)"/>
    <path d="M28 7 L23 2 L21 8 Z" fill="var(--ink)"/>
    <circle cx="17" cy="18" r="15" fill="var(--ink)"/>
    <circle cx="11.5" cy="16" r="6" fill="var(--paper)"/>
    <circle cx="22.5" cy="16" r="6" fill="var(--paper)"/>
    <circle cx="11.5" cy="16" r="2.6" fill="var(--accent)"/>
    <circle cx="22.5" cy="16" r="2.6" fill="var(--accent)"/>
    <path d="M17 20 L14.8 23.5 L19.2 23.5 Z" fill="var(--amber)"/>
  </svg>
</div>

<!-- The home-page banner, square. The two canvases and `data-vf-banner` are
     _includes/voidflux-field.html; the copy is _games/voidflux.md's own title
     and tagline. -->
<div class="board board-voidflux vf-field" data-vf-banner>
  <canvas class="vf-grid" aria-hidden="true"></canvas>
  <canvas class="vf-scene" aria-hidden="true"></canvas>
  <div class="game-blurb">
    <div class="game-title">VoidFlux</div>
    <div class="game-tag">A puzzle in the depths of Electromagnetism.</div>
  </div>
</div>

<script>
  const board = location.hash.replace('#', '') || 'cover';
  document.body.dataset.board = board;

  // Only the VoidFlux board pulls in the scene, so the cream boards still
  // render off `file://` with no module loader and no three.js fetch.
  if (board === 'voidflux') {
    const runtime = document.createElement('script');
    runtime.type = 'module';
    runtime.src = '../../js/voidflux-banner.js';
    document.body.append(runtime);
  }
</script>
</body>
</html>
