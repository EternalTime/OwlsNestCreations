title: Owl's Nest Creations
description: >-
  Owl's Nest Creations turns equations into experiences you can hold
  in one hand. Each of our games is designed with physics at its heart.
  Let's play!
url: "https://owlsnestcreations.com"
email: hello@owlsnestcreations.com

# The person behind the studio, named in llms.txt and the studio's schema.org
# data. `llms` is the index of his own site written for language models.
founder:
  name: Damian Sowinski
  url: https://damiansowinski.com/
  llms: https://damiansowinski.com/llms.txt

# Rendered by _includes/social-links.html in the footer and on the about page.
# Add a network by adding a name and url here; remove the list and nothing renders.
social:
  - name: Facebook
    url: https://www.facebook.com/profile.php?id=61592827059872

collections:
  games:
    output: true
    permalink: /games/:name/

# Every game's file carries the same keys, and this block is where that shape
# is written down: a key a game can leave out is a key with a default here, so
# nothing about a game is ever missing, only defaulted. The keys with no
# default are the game's own words, and every game states all of them:
# `title`, `banner_title`, `tagline` and `order`, plus `release_note` while it
# is unreleased and `appstore_url` once it is out. A banner may read keys of
# its own on top of these; README's Structure section lists the card's.
defaults:
  - scope:
      path: ""
      type: games
    values:
      layout: game
      # The release switch, which with `page_unlisted` below is all a game may
      # differ by. Off, the banner links nowhere and the game's page is not
      # written; on, the "More about" and App Store links appear and the page
      # is published.
      released: false
      # A page published ahead of its game: on, an unreleased game's page is
      # written and reachable by its URL, but the banner still links nowhere
      # and nothing else on the site names it. It comes out when `released`
      # goes on.
      page_unlisted: false
      # Which set of pieces the game has. `card` is the icon-on-a-gradient
      # banner, which needs no code of its own.
      banner: card
      # The paragraph under the tagline, for a game that has one to say.
      teaser:
      # The page's meta description; the studio's own if the game has none.
      description:
      # Whether the game's page copy sets equations, which loads KaTeX.
      math: false
      # What the game runs on and the day it came out, for the machine-readable
      # copies of the game (`/data/games.json` and the page's schema.org data).
      platforms: []
      release_date:

sass:
  style: compressed
  quiet_deps: true

# Jekyll skips dot-directories unless told otherwise; this one holds the
# text-and-data-mining reservation (W3C TDMRep).
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
